<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Duct Viewer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="app">
      <aside class="panel">
        <header class="brand">
          <span class="brand__mark"></span>
          <div>
            <h1>Duct Viewer</h1>
            <p>Crenna rectangular duct codes</p>
          </div>
        </header>

        <form id="code-form" class="code-form" autocomplete="off">
          <label for="code-input">Product code</label>
          <div class="code-form__row">
            <input id="code-input" spellcheck="false" placeholder="KK-1-1500-1000-0" />
            <button type="submit">Show</button>
          </div>
          <p id="code-error" class="code-error" role="alert"></p>
        </form>


        <section class="spec">
          <h2>Decoded</h2>
          <dl id="spec-list"></dl>
          <ul id="warnings" class="warnings"></ul>
        </section>

        <footer class="panel__foot">
          Based on Crenna datasheets KK (v4.0), KD (v3.0), KB (v3.0), KS (v3.0), KÖ (v3.0) and KT (v3.0). Visual model – not a manufacturing drawing.
        </footer>
      </aside>

      <main class="stage">
        <div id="viewport" class="viewport"></div>

        <div class="toolbar" role="toolbar" aria-label="View">
          <div class="seg" id="views">
            <button type="button" data-view="iso" class="is-active">3D</button>
            <button type="button" data-view="end">End</button>
            <button type="button" data-view="side">Side</button>
            <button type="button" data-view="top">Top</button>
          </div>
          <div class="seg">
            <button type="button" id="toggle-dims" class="is-active" aria-pressed="true">Dimensions</button>
            <button type="button" id="toggle-ins" class="is-active" aria-pressed="true">Insulation</button>
            <button type="button" id="toggle-section" aria-pressed="false">Section</button>
          </div>
          <div class="seg" id="rotate">
            <button type="button" data-rotate="left" title="Roll the duct 90° counter-clockwise">Rotate left</button>
            <button type="button" id="rotation-reset" class="angle" title="Reset rotation" disabled>0°</button>
            <button type="button" data-rotate="right" title="Roll the duct 90° clockwise">Rotate right</button>
          </div>
          <button type="button" id="snapshot" class="ghost">Save PNG</button>
        </div>

        <p class="hint">Drag to rotate · Right-drag to pan · Scroll to zoom</p>
      </main>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
